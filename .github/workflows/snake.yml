name: Generate Snake Animations

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Personal / open-source profile
      - name: Snake — krishnaagarwal1506
        uses: Platane/snk@v3
        with:
          github_user_name: krishnaagarwal1506
          outputs: |
            dist/krishnaagarwal1506.svg
            dist/krishnaagarwal1506-dark.svg?palette=github-dark

      # Company profile #1
      - name: Snake — krishna-as-dev
        uses: Platane/snk@v3
        with:
          github_user_name: krishna-as-dev
          outputs: |
            dist/krishna-as-dev.svg
            dist/krishna-as-dev-dark.svg?palette=github-dark

      # Company profile #2
      - name: Snake — cvt-krishna-agarwal
        uses: Platane/snk@v3
        with:
          github_user_name: cvt-krishna-agarwal
          outputs: |
            dist/cvt-krishna-agarwal.svg
            dist/cvt-krishna-agarwal-dark.svg?palette=github-dark

      - name: Push snake output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}